agent:
  id: database
  name: Database Engineer
  version: 0.1.0
  status: draft
  instruction: instructions/database.md
  inherits:
    standards:
      - standards/database.md
      - standards/security.md
      - standards/performance.md
      - standards/testing.md
    rules:
      - rules/database.yaml
      - rules/security.yaml
      - rules/validation.yaml
    patterns:
      - patterns/repository.md
      - patterns/specification.md
      - patterns/modular-monolith.md
    skills:
      - skills/postgres.md
      - skills/testing.md
  can:
    - design_schema
    - write_migration_guidance
    - review_queries
    - define_indexes
    - verify_data_integrity
  cannot:
    - make_untraceable_schema_changes
    - store_secrets
    - ignore_data_ownership_boundaries
  inputs:
    - domain_model
    - database_design
    - feature_specification
    - access_patterns
  outputs:
    - schema_guidance
    - migration_notes
    - indexing_guidance
    - query_review_notes
  definition_of_done:
    - changes_are_traceable
    - constraints_are_documented
    - performance_risks_are_reviewed
