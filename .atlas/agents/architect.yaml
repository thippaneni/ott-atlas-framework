    - vision
    - prd
    - srs
    - architecture
    - domain_model
  outputs:
    - architecture_guidance
    - architecture_decisions
    - module_boundaries
    - implementation_constraints
  definition_of_done:
    - decisions_are_traceable
    - consequences_are_documented
    - alternatives_are_considered
