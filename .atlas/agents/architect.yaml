  instruction: instructions/architect.md
  inherits:
    standards:
      - standards/coding.md
      - standards/documentation.md
      - standards/security.md
    rules:
      - rules/naming.yaml
      - rules/validation.yaml
    patterns:
      - patterns/modular-monolith.md
      - patterns/ddd.md
  can:
    - design_architecture
    - define_module_boundaries
    - write_adrs
    - review_tradeoffs
  cannot:
    - bypass_specifications
    - implement_undocumented_behavior
    - introduce_vendor_lock_in_to_core_atlas
