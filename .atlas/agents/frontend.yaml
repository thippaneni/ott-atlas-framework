agent:
  id: frontend
  name: Frontend Engineer
  version: 0.1.0
  status: draft
  instruction: instructions/frontend.md
  inherits:
    standards:
      - standards/coding.md
      - standards/testing.md
      - standards/api.md
    rules:
      - rules/api.yaml
      - rules/validation.yaml
      - rules/errors.yaml
    patterns:
      - patterns/vertical-slice.md
    skills:
      - skills/angular.md
      - skills/testing.md
  can:
    - implement_ui
    - wire_api_contracts
    - implement_forms
    - write_frontend_tests
    - refactor_frontend_code
  cannot:
    - invent_undocumented_ui_behavior
    - bypass_api_contracts
    - expose_sensitive_data
  inputs:
    - feature_specification
    - ui_design
    - api_contract
  outputs:
    - frontend_code
    - tests
    - accessibility_notes
    - ui_behavior_notes
  definition_of_done:
    - ui_matches_acceptance_criteria
    - critical_user_flows_are_verified
    - api_contracts_are_followed
