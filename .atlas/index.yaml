version: 1.0.0
atlas:
  name: Atlas
  specification: ATS.md

boot:
  load_order:
    - manifest.yaml
    - ATS.md
    - principles.md
    - index.yaml
    - contexts.yaml
    - capabilities.yaml
  module_discovery: index.yaml

knowledge_graph:
  purpose: Defines the Atlas knowledge graph for module discovery, dependencies, load order, and context resolution.
  dependency_order:
    - knowledge
    - standards
    - rules
    - patterns
    - skills
    - instructions
    - agents
  nodes:
    - standards
    - rules
    - patterns
    - skills
    - instructions
    - agents
    - templates
    - checklists
    - architecture
    - knowledge
    - specifications
  edges:
    - depends_on
    - implements
    - references
    - extends
    - validates
    - replaces
    - uses

modules:
  standards:
    path: standards/
    type: engineering_standard
    files:
      - standards/api.md
      - standards/coding.md
      - standards/database.md
      - standards/documentation.md
      - standards/git.md
      - standards/performance.md
      - standards/security.md
      - standards/testing.md

  rules:
    path: rules/
    type: validation_rule
    files:
      - rules/api.yaml
      - rules/database.yaml
      - rules/errors.yaml
      - rules/logging.yaml
      - rules/naming.yaml
      - rules/security.yaml
      - rules/validation.yaml

  patterns:
    path: patterns/
    type: development_pattern
    files:
      - patterns/api-pattern.md
      - patterns/ddd.md
      - patterns/domain-events.md
      - patterns/factory.md
      - patterns/modular-monolith.md
      - patterns/repository.md
      - patterns/result-pattern.md
      - patterns/specification.md
      - patterns/vertical-slice.md

  skills:
    path: skills/
    type: capability_skill
    files:
      - skills/angular.md
      - skills/aws.md
      - skills/dotnet.md
      - skills/openai.md
      - skills/postgres.md
      - skills/python.md
      - skills/testing.md

  instructions:
    path: instructions/
    type: role_instruction
    files:
      - instructions/ai.md
      - instructions/architect.md
      - instructions/backend.md
      - instructions/database.md
      - instructions/devops.md
      - instructions/frontend.md
      - instructions/product.md
      - instructions/reviewer.md
      - instructions/tester.md

  agents:
    path: agents/
    type: ai_agent_config
    files:
      - agents/ai.yaml
      - agents/architect.yaml
      - agents/backend.yaml
      - agents/database.yaml
      - agents/devops.yaml
      - agents/frontend.yaml
      - agents/product.yaml
      - agents/reviewer.yaml
      - agents/tester.yaml

  architecture:
    path: architecture/
    type: architecture_knowledge
    files:
      - architecture/decisions/ADR-0001-adopt-specification-driven-software-development.md
      - architecture/decisions/ADR-0002-atlas-shall-be-ai-first.md
      - architecture/decisions/ADR-0003-knowledge-driven-context-loading.md
      - architecture/decisions/ADR-0004-modular-knowledge-architecture.md
      - architecture/decisions/ADR-0005-configuration-over-prompts.md
      - architecture/decisions/ADR-0006-ai-provider-agnostic-framework.md

  knowledge:
    path: knowledge/
    type: domain_knowledge
    files: []

  prompts:
    path: prompts/
    type: prompt_template
    files: []

  templates:
    path: templates/
    type: artifact_template
    files: []

  checklists:
    path: checklists/
    type: verification_checklist
    files: []

specification_hierarchy:
  - vision
  - prd
  - srs
  - architecture
  - domain_model
  - epic
  - feature
  - story
  - task
  - implementation

technology_stack:
  backend: dotnet
  frontend: angular
  database: postgresql
  cloud: aws
  ai: openai
  automation: python
  testing: multi_layer

extension_policy:
  projects_may_extend_atlas: true
  extensions_may_modify_core_behavior: false
  custom_modules_registered_through: index.yaml
